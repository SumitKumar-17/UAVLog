name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-tests:
    name: SQL guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install uv
          uv sync --no-install-project
      - name: Run the guard tests (46 hostile and 18 legitimate queries, no database needed)
        working-directory: backend
        run: uv run python -m unittest tests.test_guard -v

  migrations:
    name: Migrations on an empty database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env && sed -i 's/change-me/ci-only-password/' .env
      - name: Start the database and backend with the project's own compose file
        run: docker compose up -d --build db backend
      - name: Wait for the database
        run: until docker compose exec -T db pg_isready -U uavlog -d uavlog; do sleep 2; done
      - name: Apply every migration
        run: docker compose exec -T backend alembic upgrade head
      - name: Seed the ontology
        run: docker compose exec -T backend python scripts/seed_ontology.py
      - name: Check the semantic layer exists and the restricted role cannot read base tables
        run: |
          docker compose exec -T db psql -U uavlog -d uavlog -c "select count(*) from semantic.signals"
          ! docker compose exec -T db psql -U uavlog -d uavlog -c "set role uav_reader; select count(*) from flight"
      - name: Roll the last migration back and forward again
        run: |
          docker compose exec -T backend alembic downgrade -1
          docker compose exec -T backend alembic upgrade head

  web:
    name: Web type check, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
