# backend and api run the same code and dependencies: one image, so they can never drift apart
x-app-image: &app-image
  build: ./backend
  image: uavlog-app

services:
  db:
    image: timescale/timescaledb-ha:pg17
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb,pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    shm_size: 3gb  # parallel index builds allocate maintenance_work_mem in shared memory; keep this above it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *app-image
    env_file: .env
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NLSQL_DB_PASSWORD: ${NLSQL_DB_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./bench:/bench
      - ${HOST_DATA_DIR:-./data}:/data
    command: ["sleep", "infinity"]

  api:
    <<: *app-image
    env_file: .env
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # set NLSQL_DB_PASSWORD in .env (then run migrations) to make model-written SQL connect as the restricted login role uav_nlsql
      NLSQL_DATABASE_URL: ${NLSQL_DB_PASSWORD:+postgresql://uav_nlsql:${NLSQL_DB_PASSWORD}@db:5432/${POSTGRES_DB}}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./bench:/bench:ro
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    image: node:24
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
    command: ["sh", "-c", "mkdir -p /tmp/bin && corepack enable --install-directory /tmp/bin && export PATH=/tmp/bin:$$PATH && pnpm install --frozen-lockfile && pnpm dev -H 0.0.0.0"]

volumes:
  pgdata:
