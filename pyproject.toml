# Root project file used only by the Vercel deployment of the API (see docs/deploy.md). The full backend is backend/pyproject.toml.
[project]
name = "uavlog-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "httpx>=0.27",
  "sqlglot>=25",
  "pgvector>=0.3",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.uv]
package = false

[tool.setuptools]
py-modules = []
